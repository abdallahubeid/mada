# ─────────────────────────────────────────────────────────────────────────────
# Mada — Render infrastructure blueprint
#
# NO SECRET VALUE APPEARS IN THIS FILE, AND NONE MAY BE ADDED.
# github.com/abdallahubeid/mada is a PUBLIC repository (verified against the
# GitHub API: "visibility": "public"). Every credential below is declared with
# `sync: false`, which tells Render the value is managed outside the blueprint;
# the values are injected over the Render API instead. A password committed
# here would be world-readable the moment it is pushed, and would stay readable
# in the git history afterwards even if removed in a later commit.
#
# RUNTIME IS DOCKER BECAUSE RENDER HAS NO PHP RUNTIME. Its API rejects it:
#   "invalid runtime: php. valid runtimes are:
#    [docker, elixir, go, node, python, ruby, rust, image]"
# See ./Dockerfile for how the PHP toolchain is assembled.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: mada
    runtime: docker
    plan: free

    # FRANKFURT, to sit beside the database — not a default.
    # The Clever Cloud MySQL host resolves to hv-par8-023.clvrcld.net, i.e.
    # Paris. The first deployment ran in Oregon, which put roughly 150ms of
    # Atlantic between the app and every single query. With session and cache
    # both database-backed at the time, a trivial request spent most of its
    # life waiting on the network and `/up` took ~28s to answer. Render fixes a
    # service's region at creation, so correcting this meant recreating it.
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile

    # `/up` is Laravel's built-in health endpoint, registered in
    # bootstrap/app.php (`health: '/up'`). Preferred over `/` because the
    # landing page renders the full CMS-driven marketing tree on every probe.
    healthCheckPath: /up

    # ── Start command ────────────────────────────────────────────────────────
    # A single executable, NOT a command chain. Render splits this string into
    # argv and execs it without a shell, so both obvious spellings fail:
    #
    #   php artisan config:cache && php artisan route:cache && ...
    #     → `&&` reaches artisan as a positional argument
    #       ("No arguments expected", exit 1)
    #
    #   sh -c "php artisan config:cache && ..."
    #     → the quoted chain is split too, and sh gets the whole string as a
    #       command name (exit 127, "not found")
    #
    # docker/start.sh holds the sequence — caches, migrate, then `exec` the
    # server so it becomes PID 1 and receives SIGTERM directly.
    dockerCommand: ./docker/start.sh

    envVars:
      - key: APP_NAME
        value: مدى
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: en

      # Generated once and set over the API. Laravel refuses to boot without
      # it, and changing it makes every previously encrypted value — sessions,
      # and the encrypted casts on platform_settings (ADR-16) — unreadable.
      - key: APP_KEY
        sync: false

      # Set over the API once Render has assigned the service its hostname,
      # which is not knowable before the service exists.
      - key: APP_URL
        sync: false

      # Logs go to the container's stderr so they land in Render's log stream.
      # The default `stack`/`single` channel writes to storage/logs/laravel.log
      # inside an ephemeral filesystem, where nothing can read it and a restart
      # discards it.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Session and cache are FILE-backed, not database-backed.
      #
      # The schema supports either — `migrate` creates both tables — but the
      # database lives in another datacentre from anything that is not the
      # Frankfurt instance, and even colocated it is a network hop. Every
      # request reads a session and usually writes one; the CMS layer reads the
      # cache repeatedly. Moving both to the local filesystem removes those
      # round trips from the hot path entirely.
      #
      # The trade is that the filesystem is ephemeral: a deploy or restart logs
      # everyone out and empties the cache. That is acceptable on a single
      # free-plan instance and would NOT be once this scales past one — at that
      # point these belong in Redis, not back in MySQL.
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file

      # Queue stays database-backed: jobs must outlive the container.
      - key: QUEUE_CONNECTION
        value: database

      # `php artisan serve` wraps PHP's built-in server, which handles ONE
      # request at a time unless told otherwise. Render probes /up continuously,
      # and with a single worker those probes monopolise the server — external
      # requests queue behind them and time out. Laravel's serve command reads
      # this variable and forks that many workers.
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"

      # Reverb (websockets) is a separate long-running process and is not part
      # of this service. `null` keeps broadcast calls from attempting to reach
      # a server that is not deployed.
      - key: BROADCAST_CONNECTION
        value: "null"

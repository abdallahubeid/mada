# ─────────────────────────────────────────────────────────────────────────────
# Mada — Render infrastructure blueprint
#
# NO SECRET VALUE APPEARS IN THIS FILE, AND NONE MAY BE ADDED.
# github.com/abdallahubeid/mada is a PUBLIC repository (verified against the
# GitHub API: "visibility": "public"). Every credential below is declared with
# `sync: false`, which tells Render the value is managed outside the blueprint;
# the values are injected over the Render API instead. A password committed
# here would be world-readable the moment it is pushed, and would stay readable
# in the git history afterwards even if removed in a later commit.
#
# RUNTIME IS DOCKER BECAUSE RENDER HAS NO PHP RUNTIME. Its API rejects it:
#   "invalid runtime: php. valid runtimes are:
#    [docker, elixir, go, node, python, ruby, rust, image]"
# See ./Dockerfile for how the PHP toolchain is assembled.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: mada
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile

    # `/up` is Laravel's built-in health endpoint, registered in
    # bootstrap/app.php (`health: '/up'`). Preferred over `/` because the
    # landing page renders the full CMS-driven marketing tree on every probe.
    healthCheckPath: /up

    # ── Start command ────────────────────────────────────────────────────────
    # The three cache commands belong HERE rather than in the build, because
    # Render does not expose service environment variables to `docker build`.
    # Cached during the build, config.php would freeze the DB credentials as
    # empty strings — and a config cache outranks the environment at runtime,
    # so the app would boot and then fail every query.
    #
    # `migrate --force` runs unattended (no confirmation prompt in production).
    # Safe on the free plan, which runs a single instance; with more than one
    # instance this would need to move to a release step or a job, since
    # concurrent migrators race on the same schema.
    # NOT wrapped in `sh -c "..."`. Render already evaluates this string with a
    # shell, so wrapping it again nested one shell inside another and the whole
    # `&&` chain arrived as a single command name:
    #   sh: 1: php artisan config:cache && php artisan route:cache && ...: not found
    # exit status 127. Given plainly, the `&&` operators and `$PORT` are the
    # outer shell's to interpret, which is what was wanted all along.
    dockerCommand: php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT

    envVars:
      - key: APP_NAME
        value: مدى
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: en

      # Generated once and set over the API. Laravel refuses to boot without
      # it, and changing it makes every previously encrypted value — sessions,
      # and the encrypted casts on platform_settings (ADR-16) — unreadable.
      - key: APP_KEY
        sync: false

      # Set over the API once Render has assigned the service its hostname,
      # which is not knowable before the service exists.
      - key: APP_URL
        sync: false

      # Logs go to the container's stderr so they land in Render's log stream.
      # The default `stack`/`single` channel writes to storage/logs/laravel.log
      # inside an ephemeral filesystem, where nothing can read it and a restart
      # discards it.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # All three are database-backed, so the schema created by `migrate`
      # covers them and no Redis instance is required.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # Reverb (websockets) is a separate long-running process and is not part
      # of this service. `null` keeps broadcast calls from attempting to reach
      # a server that is not deployed.
      - key: BROADCAST_CONNECTION
        value: "null"
